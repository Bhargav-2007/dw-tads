name: dwtds-mvp

x-health: &health
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  postgres:
    image: postgres:16.6-bookworm
    environment:
      POSTGRES_USER: dwtds
      POSTGRES_DB: dwtds
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dwtds_password}
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "pg_isready -U dwtds -d dwtds"]
    networks:
      - dwtds-mvp

  neo4j:
    image: neo4j:5.26.0-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-dwtds_password}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_dbms_usage__report_enabled: "false"
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - graph:/data
      - ./infra/neo4j/constraints.cypher:/var/lib/neo4j/import/constraints.cypher:ro
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474"]
    networks:
      - dwtds-mvp

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "9000:9000"
    volumes:
      - objects:/data
    healthcheck:
      <<: *health
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
    networks:
      - dwtds-mvp

  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
      - "9092:9092"
    volumes:
      - events:/var/lib/kafka/data
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null"]
    networks:
      - dwtds-mvp

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"
    healthcheck:
      <<: *health
      test: ["CMD", "redis-cli", "ping"]
    networks:
      - dwtds-mvp

  plane1-infrastructure:
    build:
      context: .
      dockerfile: plane1-infrastructure/Dockerfile
    image: dwtds-plane1:latest
    environment: &plane-env
      PLANE_PORT: 8001
      KAFKA_BOOTSTRAP: kafka:9092
      KAFKA_HOST: kafka
      KAFKA_PORT: 9092
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: dwtds
      PGUSER: dwtds
      PGPASSWORD: ${POSTGRES_PASSWORD:-dwtds_password}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_HOST: neo4j
      NEO4J_BOLT_PORT: 7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-dwtds_password}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
      MOCK_MODE: ${MOCK_MODE:-true}
    ports:
      - "8001:8001"
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      kafka: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=4)"]
    networks:
      - dwtds-mvp

  plane2-collection:
    build:
      context: .
      dockerfile: plane2-collection/Dockerfile
    image: dwtds-plane2:latest
    environment:
      <<: *plane-env
      PLANE_PORT: 8002
    ports:
      - "8002:8002"
    depends_on:
      plane1-infrastructure: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health', timeout=4)"]
    networks:
      - dwtds-mvp

  plane3-analytics:
    build:
      context: .
      dockerfile: plane3-analytics/Dockerfile
    image: dwtds-plane3:latest
    environment:
      <<: *plane-env
      PLANE_PORT: 8003
    ports:
      - "8003:8003"
    depends_on:
      plane1-infrastructure: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health', timeout=4)"]
    networks:
      - dwtds-mvp

  plane4-fusion:
    build:
      context: .
      dockerfile: plane4-fusion/Dockerfile
    image: dwtds-plane4:latest
    environment:
      <<: *plane-env
      PLANE_PORT: 8004
    ports:
      - "8004:8004"
    depends_on:
      plane1-infrastructure: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=4)"]
    networks:
      - dwtds-mvp

  plane5-legal:
    build:
      context: .
      dockerfile: plane5-legal/Dockerfile
    image: dwtds-plane5:latest
    environment:
      <<: *plane-env
      PLANE_PORT: 8005
    ports:
      - "8005:8005"
    depends_on:
      plane1-infrastructure: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health', timeout=4)"]
    networks:
      - dwtds-mvp

  plane6-case:
    build:
      context: .
      dockerfile: plane6-case/Dockerfile
    image: dwtds-plane6:latest
    environment:
      <<: *plane-env
      PLANE_PORT: 8006
    ports:
      - "8006:8006"
    depends_on:
      plane1-infrastructure: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health', timeout=4)"]
    networks:
      - dwtds-mvp

  plane7-presentation:
    build:
      context: .
      dockerfile: plane7-presentation/Dockerfile
    image: dwtds-plane7:latest
    environment:
      <<: *plane-env
      PLANE_PORT: 8007
    ports:
      - "8007:8007"
    depends_on:
      plane1-infrastructure: { condition: service_healthy }
    healthcheck:
      <<: *health
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health', timeout=4)"]
    networks:
      - dwtds-mvp

networks:
  dwtds-mvp:
    name: dwtds-mvp

volumes:
  pg:
  graph:
  objects:
  events:
