# Apply after docker-compose.airgap.yml. Existing volumes are preserved.
services:
  demo:
    image: dwtds-public-intel:2.0.0
    command: [uvicorn, intel.app:app, --host, '0.0.0.0', --port, '8000']
  worker:
    image: dwtds-public-intel:2.0.0
    command: [uvicorn, intel.worker:app, --host, '0.0.0.0', --port, '8001']
  gateway:
    image: dwtds-public-intel:2.0.0
  collector:
    image: dwtds-public-intel:2.0.0
    command: [uvicorn, intel.collector:app, --host, '0.0.0.0', --port, '8001']
    env_file: .env
    environment:
      PGHOST: postgres
      PGDATABASE: dwtds
      PGUSER: dwtds
      PGPASSWORD: ${POSTGRES_PASSWORD}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      MINIO_ENDPOINT: minio:9000
      KAFKA_BOOTSTRAP: kafka:9092
    depends_on:
      demo: {condition: service_healthy}
    healthcheck:
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8001/ready", timeout=4)']
    stop_grace_period: 10s
    networks: [backend, feed-egress]
networks:
  feed-egress:
